[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldbot"
version = "0.1.0"
description = "Intraday trading bots for gold and US indices with a backtester and Capital.com demo execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
goldbot = "goldbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
